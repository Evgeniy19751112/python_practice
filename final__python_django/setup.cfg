[mypy]
implicit_optional = True
disable_error_code = import-untyped

[flake8]
exclude = .git,__pycache__,.venv,diploma-frontend,htmlcov,static,uploads
; Поставил ограничитель чуть больше, чем рекомендует PEP8
max-line-length = 89
ignore =
    # PIE786 Use precise exception handlers. Оставлено для перехвата исключений
    PIE786,
    # W503 line break before binary operator. В длинных условиях IF ругается
    W503,
    # ./megano/product/services.py. W504 line break after binary operator
    W504

[isort]
profile = "black"
multi_line_output = 3
