version: '3.7'

services:

  postgres_test:
    image: postgres:16.3-alpine3.20
    hostname: host_db
    container_name: test_pgsql
    env_file:
        - .env_test_db
    environment:
      PGDATA: "/var/lib/postgresql/data"
    command:
      - "postgres"
      - "-c"
      - "config_file=/etc/postgresql.conf"
    ports:
      - "5432:5432"
    volumes:
      - ./postgresql.conf:/etc/postgresql.conf:ro
      - ./initdb_test:/docker-entrypoint-initdb.d:ro
      - type: bind
        source: ${PWD}/db_test
        target: /var/lib/postgresql/data
        read_only: false
      - type: bind
        source: ${PWD}/logs/postgres_test
        target: /var/log/postgresql
        read_only: false
    networks:
      - test_network
