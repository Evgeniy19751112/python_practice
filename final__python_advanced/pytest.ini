[pytest]
console_output_style = count
log_level = DEBUG
addopts = --verbose --showlocals -rsxX --tb=short --strict
minversion = 8.0
asyncio_mode = auto
markers =
    database: Run the test functions that test only DB
    api: Run the test functions that test use FastAPI
    anyio: Test to be run asynchronously via anyio
    db_utils: Run the test functions that use utils for DB
    utils: Run the test functions that use different utils
testpaths = ./tests
;filterwarnings =
;    ignore:PydanticDeprecatedSince20
norecursedirs = .* db db_test server_nginx initdb_*
