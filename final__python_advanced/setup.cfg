[mypy]
;plugins = sqlalchemy.ext.mypy.plugin
implicit_optional=True

[mypy-uvicorn]
ignore_missing_imports = True

[mypy-server_app.database.db]
disable_error_code = attr-defined

[mypy-server_app.database.models.common]
disable_error_code = attr-defined

[mypy-server_app.database.models.user]
disable_error_code = attr-defined

[mypy-server_app.database.models.tweet]
disable_error_code = attr-defined

[mypy-server_app.database.models.media]
disable_error_code = attr-defined

[mypy-make_fake_data]
disable_error_code = attr-defined, union-attr, arg-type

[flake8]
exclude = .git,__pycache__,db,logs,server_nginx,initdb_prod,initdb_test
max-line-length = 79
ignore =
    # PIE786 Use precise exception handlers. Оставлено для перехвата исключений
    PIE786,
    # W503 line break before binary operator. В длинных условиях IF ругается
    W503

[isort]
profile = "black"
multi_line_output=3

[mypy-tests.test_crud]
disable_error_code = assignment, union-attr

[mypy-tests.test_database]
disable_error_code = assignment, union-attr, attr-defined
